<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 20px;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #eee;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
        }
        .link-card {
            display: block;
            background-color: #ffffff;
            color: #333;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            background-color: #f1f3f5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome to My Space</h1>

    <a href="https://www.instagram.com/자신의아이디" target="_blank" class="link-card">
        📸 개인 Instagram 바로가기
    </a>
    
    <a href="https://연구실홈페이지주소" target="_blank" class="link-card">
        🔬 연구실 홈페이지 바로가기
    </a>
    
    <a href="https://출판서적링크(또는 내부페이지)" target="_blank" class="link-card">
        📚 출판 서적 소개
    </a>
</div>

</body>
</html>
