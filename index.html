<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seung-Won Oh | Space</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
            margin: 0;
            padding: 50px 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        /* 프로필 헤더 */
        .profile-header {
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2.4em;
            color: #2c3e50;
            margin: 0 0 12px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .bio {
            font-size: 1em;
            color: #57606f;
            margin: 0;
            font-weight: 400;
            word-break: keep-all;
            line-height: 1.6;
        }

        /* 링크 카드 공통 스타일 */
        .link-card {
            display: block;
            position: relative;
            width: 100%;
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
            text-decoration: none;
            color: #fff;
            box-shadow: 0 10px 25px rgba(44, 62, 80, 0.08);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .link-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 38px rgba(44, 62, 80, 0.18);
        }

        /* 기본 카드 높이 (Lab, Book) */
        .standard-card {
            height: 160px;
        }

        /* 1. 인스타그램 프리뷰 카드 스타일 */
        #card-instagram {
            background-image: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 24px;
            box-sizing: border-box;
            text-align: left;
        }
        .insta-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .insta-title-wrapper {
            display: flex;
            flex-direction: column;
        }
        .insta-header .title { font-size: 1.5em; font-weight: 600; margin: 0; }
        .insta-header .subtitle { font-size: 0.9em; opacity: 0.9; margin: 2px 0 0 0; font-weight: 300; }
        
        /* 인스타 내용물 미리보기 격자 (Preview Grid) */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 12px;
            justify-content: center;
            margin-top: 10px;
        }
        .preview-item {
            width: 100px;
            height: 100px;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .link-card:hover .preview-item {
            transform: scale(1.03);
        }

        /* 일반 카드 내부 레이아웃 (Lab, Book) */
        #card-lab { background-image: linear-gradient(135deg, #1f4068 0%, #162447 100%); }
        #card-book { background-image: linear-gradient(135deg, #8d6e63 0%, #4e342e 100%); }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .link-card:hover .overlay { background-color: rgba(0, 0, 0, 0.3); }

        .icon-wrapper {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }
        .icon { font-size: 2.4em; transition: transform 0.3s ease; }
        .link-card:hover .icon { transform: scale(1.1); }

        .standard-card .title { font-size: 1.5em; font-weight: 600; margin: 0; letter-spacing: 0.5px; }
        .standard-card .subtitle { font-size: 0.95em; margin: 6px 0 0 0; opacity: 0.85; font-weight: 300; word-break: keep-all; }

        /* 2. 하단 멀티 소셜 칩 영역 (학과홈피, 스칼라, 이메일) */
        .social-footer {
            margin-top: 45px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }
        .footer-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background-color: #ffffff;
            border-radius: 30px;
            color: #333333;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(44, 62, 80, 0.06);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(0,0,0,0.03);
        }
        .footer-chip:hover {
            transform: translateY(-3px);
            background-color: #2c3e50;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(44, 62, 80, 0.15);
        }
        .footer-chip .chip-icon {
            font-size: 1.1em;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-header">
        <h1>Seung-Won Oh</h1>
        <p class="bio">빛과 액정을 연구하는 연구자,<br>일상을 그리는 그림 작가</p>
    </div>

    <a href="https://www.instagram.com/oh.seungwon" target="_blank" class="link-card" id="card-instagram">
        <div class="insta-header">
            <span class="icon">📸</span>
            <div class="insta-title-wrapper">
                <p class="title">Instagram</p>
                <p class="subtitle">@oh.seungwon 일상 및 그림 기록</p>
            </div>
        </div>
        <div class="preview-grid">
            <div class="preview-item">
                <img src="preview1.png" alt="그림 기록 1">
            </div>
            <div class="preview-item">
                <img src="preview2.png" alt="그림 기록 2">
            </div>
            <div class="preview-item">
                <img src="preview3.png" alt="그림 기록 3">
            </div>
        </div>
    </a>
    
    <a href="https://sites.google.com/view/lcphotonicslab" target="_blank" class="link-card standard-card" id="card-lab">
        <div class="overlay">
            <div class="icon-wrapper">
                <span class="icon">🔬</span>
            </div>
            <p class="title">Research Lab</p>
            <p class="subtitle">Liquid Crystals & Photonics Laboratory</p>
        </div>
    </a>
    
    <a href="book.html" class="link-card standard-card" id="card-book">
        <div class="overlay">
            <div class="icon-wrapper">
                <span class="icon">📚</span>
            </div>
            <p class="title">Books</p>
            <p class="subtitle">독립출판 및 저서 소개</p>
        </div>
    </a>

    <div class="social-footer">
        <a href="https://eais.kangwon.ac.kr/EAIS/index.do" target="_blank" class="footer-chip">
            <span class="chip-icon">🏫</span> 학과 프로필
        </a>
        <a href="https://scholar.google.com/citations?user=fA6JVIgAAAAJ&hl=ko" target="_blank" class="footer-chip">
            <span class="chip-icon">🎓</span> Google Scholar
        </a>
        <a href="mailto:ohseungwon@kangwon.ac.kr" class="footer-chip">
            <span class="chip-icon">✉️</span> Contact
        </a>
    </div>
</div>

</body>
</html>
